name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The Qt and FFmpeg of Ubuntu 26.04, which the .deb is made for.
    container: ubuntu:26.04
    steps:
      - name: Install build tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates build-essential debhelper cmake pkgconf dpkg-dev file python3 \
            qt6-base-dev qt6-multimedia-dev qt6-websockets-dev qt6-tools-dev qt6-l10n-tools \
            libavcodec-dev libavutil-dev libswscale-dev libssl-dev

      - uses: actions/checkout@v7

      - name: Build, test and package
        # The same package as the PPA's: debian/ and dpkg-buildpackage, which also runs the tests.
        run: |
          python3 -m py_compile tools/kiosk-sim/kiosk_sim.py
          dpkg-buildpackage -us -uc -b
          mkdir dist && mv ../*.deb dist/

      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: deb

      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/^project(intercom-satellite VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version"
            exit 1
          fi
          packaged=$(sed -n '1s/^[^(]*(\([^-)]*\).*/\1/p' debian/changelog)
          if [ "$packaged" != "$version" ]; then
            echo "::error::debian/changelog is at $packaged, the project at $version"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Intercom Satellite Desktop App ${GITHUB_REF_NAME#v}" --generate-notes ./*.deb
